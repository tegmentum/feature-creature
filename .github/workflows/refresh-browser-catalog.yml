name: Refresh browser catalog

# Detect when the `browser:*` WIT packages under `wit/deps/browser-*/` in
# the WasmOS monorepo have shifted since `browser-features.toml` was
# last regenerated, and open a PR proposing the update.
#
# Runs weekly on Monday morning + on manual dispatch. Requires a
# `WASMOS_REPO_TOKEN` secret — a fine-grained PAT with read access to
# tegmentum/wasmos (or a GitHub App installation token with the same
# scope). Without the secret the workflow fails cleanly with an
# actionable message; nothing else in CI depends on it.

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: refresh browser-features.toml
    runs-on: ubuntu-latest
    steps:
      - name: Check that the WasmOS access token is configured
        env:
          WASMOS_REPO_TOKEN: ${{ secrets.WASMOS_REPO_TOKEN }}
        run: |
          if [ -z "$WASMOS_REPO_TOKEN" ]; then
            echo "::error::WASMOS_REPO_TOKEN secret is missing; configure a fine-grained"
            echo "::error::PAT with read access to tegmentum/wasmos before running this workflow."
            exit 1
          fi

      - name: Check out feature-creature
        uses: actions/checkout@v5
        with:
          path: feature-creature

      - name: Check out WasmOS at HEAD (private)
        uses: actions/checkout@v5
        with:
          repository: tegmentum/wasmos
          token: ${{ secrets.WASMOS_REPO_TOKEN }}
          ref: main
          # We only need the WIT dep tree; skip LFS + shallow.
          fetch-depth: 1
          path: wasmos

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate browser-features.toml
        working-directory: feature-creature
        env:
          WASMOS_ROOT: ${{ github.workspace }}/wasmos
        run: node scripts/gen-browser-catalog.mjs

      - name: Detect drift
        id: drift
        working-directory: feature-creature
        run: |
          if git diff --quiet browser-features.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "browser-features.toml is up to date with WasmOS main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::browser-features.toml drifted; opening a refresh PR."
            git --no-pager diff browser-features.toml | head -80
          fi

      - name: Open a refresh PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: feature-creature
          add-paths: browser-features.toml
          branch: bot/refresh-browser-catalog
          delete-branch: true
          title: "chore(browser-features): refresh catalog from WasmOS main"
          commit-message: |
            chore(browser-features): refresh catalog from WasmOS main

            Auto-regenerated by .github/workflows/refresh-browser-catalog.yml
            against the current head of tegmentum/wasmos:main.

            Verify the diff matches recent browser-* WIT changes in WasmOS
            before merging; drop this PR if the changes are already covered
            by an existing catalog refresh.
          body: |
            `scripts/gen-browser-catalog.mjs` produced a different `browser-features.toml`
            than what is currently committed. This usually means a new `browser-*` WIT
            package landed in [tegmentum/wasmos](https://github.com/tegmentum/wasmos),
            or one was renamed/removed.

            **Before merging**:
            1. Confirm the new / removed packages match the recent commits in
               WasmOS `wit/deps/`.
            2. Update `browser-subfeatures.toml` if any of the added packages
               enumerate progressive layers in their WIT docstring (like
               `browser:webgpu`).
            3. Add / remove entries in the `BUILTIN_PROBES` table
               (`web/js/browser-report.js` and the sibling in
               `@wasmos/feature-creature-browser`) so the new packages
               land somewhere sensible.
            4. Rebuild `dist/browser-detector.component.wasm`, retranspile,
               and run `node scripts/check-transpile-drift.mjs --write`
               — otherwise the Pages workflow will fail on the drift check.

            If this PR is a false alarm (WasmOS was rolled back, or the drift
            is transient) close it without merging.
          labels: |
            chore
            browser-features
