# Hand-authored subfeature taxonomies for browser WIT packages whose
# docstrings enumerate progressive growth layers. The auto-generator
# (`scripts/gen-browser-catalog.mjs`) never touches this file.
#
# Each `[[subfeature-set]]` entry names a `package` (matching the
# `package` field of a `[[browser]]` entry in `browser-features.toml`)
# and lists the ordered `names` of its documented layers. Names are
# stable slugs — never renumber, only append.
#
# Loaders' per-shim `probe()` functions in the polyfill layer report
# subfeatures using these exact slugs. A slug listed here but absent
# from a probe's response is treated as `browser-missing` on that
# platform; a slug present in a probe's response but not listed here
# is reported to the loader as an unknown-subfeature warning (the
# taxonomy needs updating).

# browser:fetch — Fetch API tiers. Base surface + AbortSignal + keepalive
# are universal on modern engines; streaming request body historically
# only in Chromium; `priority` hint is recent and still shipping.
[[subfeature-set]]
package = "browser:fetch"
names = [
    # `fetch` function.
    "basic",
    # `AbortSignal` / `AbortController` for request cancellation.
    "abort-signal",
    # Request body as `ReadableStream` — real streaming upload.
    # Chromium-only for a long time; still not universal.
    "streaming-request",
    # `{ keepalive: true }` option — small requests that outlive the
    # page (analytics beacons, unload events).
    "keepalive",
    # `{ priority: 'high' | 'low' | 'auto' }` — Fetch Priority hint.
    "priority",
]

# browser:file-system — File System Access API. OPFS
# (`navigator.storage.getDirectory`) is universal on modern engines,
# but the three "show*Picker" entry points are Chromium-only.
# `createSyncAccessHandle` is workers-only for many years — now shipping
# in Chromium + Firefox + WebKit.
[[subfeature-set]]
package = "browser:file-system"
names = [
    # `navigator.storage.getDirectory()` — Origin Private File System.
    "basic",
    # `showOpenFilePicker` — user-visible file open dialog. Chromium.
    "picker",
    # `showSaveFilePicker` — user-visible file save dialog. Chromium.
    "save-picker",
    # `showDirectoryPicker` — user-visible directory picker. Chromium.
    "directory-picker",
    # `FileSystemFileHandle.createSyncAccessHandle` — workers-only
    # synchronous handle for random-access I/O.
    "sync-access-handle",
]

# browser:indexeddb — IndexedDB modern extensions. Base surface is
# universal. Recent additions: transaction.commit() (universal now),
# transaction durability option (Chromium-first), IDBObserver (no
# engine ships it yet).
[[subfeature-set]]
package = "browser:indexeddb"
names = [
    # `indexedDB` global + `open`.
    "basic",
    # `IDBTransaction.commit()` for explicit commit control.
    "explicit-commit",
    # `{ durability: 'strict' | 'relaxed' }` option on transactions.
    "durability",
    # `IDBObserver` — no engine ships this yet; here for future.
    "observer",
]

# browser:notifications — Notification API tiers. Base constructor is
# universal on modern engines; the richer options (actions, badge,
# image) discriminate — historically Chromium only.
[[subfeature-set]]
package = "browser:notifications"
names = [
    # `Notification` constructor.
    "basic",
    # `Notification.maxActions` presence — signals actions button
    # support in this engine's notification surface.
    "actions",
    # Notification badge — badging option in the constructor.
    "badge",
    # Notification image — image option.
    "image",
    # Persistent notifications via ServiceWorkerRegistration.showNotification.
    "persistent",
]

# browser:websocket — WebSocket base surface + the streams-based
# `WebSocketStream` extension. Base is universal on modern engines;
# `WebSocketStream` is a Chromium-only extension for backpressure-aware
# streaming.
[[subfeature-set]]
package = "browser:websocket"
names = [
    # `WebSocket` constructor.
    "basic",
    # `binaryType` property on WebSocket instances (defaults to
    # `blob`; `arraybuffer` for typed-array frames). Universal on
    # modern engines.
    "binary-type",
    # `WebSocketStream` constructor — streams-based API with
    # backpressure. Chromium-only.
    "streams",
]

# browser:crypto — WebCrypto tiers. Base surface is universal; UUID
# generation and Ed25519 signing/verification are newer additions that
# ship incrementally across engines.
[[subfeature-set]]
package = "browser:crypto"
names = [
    # `crypto` + `crypto.subtle` presence.
    "basic",
    # `crypto.getRandomValues(view)` — universally available.
    "get-random-values",
    # `crypto.randomUUID()` — newer than the base surface but now
    # widely deployed.
    "random-uuid",
    # `crypto.subtle` support for Ed25519 sign / verify / generateKey.
    # Very recent addition, ships incrementally.
    "ed25519",
]

# browser:media — the getUserMedia + MediaStream + MediaRecorder trio.
# Base MediaStream is available everywhere; MediaRecorder needs the
# spec-defined recorder shape; getUserMedia needs the modern
# navigator.mediaDevices surface; enumerateDevices is often gated on
# permission.
[[subfeature-set]]
package = "browser:media"
names = [
    # `MediaStream` constructor.
    "basic",
    # `MediaRecorder` constructor.
    "recorder",
    # `navigator.mediaDevices.getUserMedia` presence.
    "get-user-media",
    # `navigator.mediaDevices.enumerateDevices` presence.
    "device-enumeration",
]

# browser:performance — Performance API tiers. Base timing is universal;
# `PerformanceObserver` is universal; `performance.memory` is Chromium-
# only (non-standard); `longtask` observability was Chromium-only for
# years and now ships more broadly.
[[subfeature-set]]
package = "browser:performance"
names = [
    # `performance.now` / `timeOrigin`.
    "basic",
    # `PerformanceObserver` constructor.
    "observer",
    # `performance.memory` — non-standard, historically Chromium-only.
    "memory",
    # LongTask API observability — `PerformanceObserver` for entry type
    # `"longtask"`. Chromium-only for years, now shipping wider.
    "longtask",
]

# browser:web-audio — AudioContext tiers. Base surface is universal on
# modern engines; AudioWorklet is universal on modern engines but was
# a real gap for years; OfflineAudioContext is universal; PannerNode
# provides spatial audio.
[[subfeature-set]]
package = "browser:web-audio"
names = [
    # `AudioContext` constructor.
    "basic",
    # `AudioWorklet` — modern low-latency processing extension.
    "worklet",
    # `OfflineAudioContext` — non-realtime rendering.
    "offline",
    # `AnalyserNode` — FFT / time-domain analysis.
    "analyser",
    # `PannerNode` + `AudioListener` — 3D spatial audio.
    "spatial",
]

# browser:webrtc — RTCPeerConnection tiers. Base peer connection +
# data channel are universal on modern engines. Insertable Streams
# (RTCRtpScriptTransform) is Chromium + Safari; Firefox historically
# not. getUserMedia is gated on permission but the API surface itself
# is universal.
[[subfeature-set]]
package = "browser:webrtc"
names = [
    # `RTCPeerConnection` constructor.
    "basic",
    # `RTCDataChannel` — either as constructor or via peer connection.
    "data-channel",
    # `navigator.mediaDevices.getUserMedia` presence (media stream feed).
    "media-streams",
    # `RTCRtpScriptTransform` — Insertable Streams for encoded
    # media frames. Chromium + Safari ship it; Firefox historically not.
    "insertable-streams",
]

# browser:service-worker — spec sub-capabilities. Background Sync,
# Periodic Sync, and Push are separate APIs bolted onto ServiceWorker;
# browsers ship them independently. Chromium ships all four today;
# Firefox and Safari ship the base + `push` but not the two sync APIs.
[[subfeature-set]]
package = "browser:service-worker"
names = [
    # Base ServiceWorker registration + lifecycle.
    "basic",
    # Background Sync API — `registration.sync.register`.
    "sync",
    # Periodic Background Sync — `registration.periodicSync.register`.
    "periodic-sync",
    # Push API — `registration.pushManager.subscribe`.
    "push",
]

# browser:worker — three flavours of Worker constructor. Dedicated
# Worker is universal, SharedWorker is missing on Safari (Playwright
# WebKit ships it now but historically not), module workers (built via
# `new Worker(url, { type: 'module' })`) are universal on modern
# browsers.
[[subfeature-set]]
package = "browser:worker"
names = [
    # Base `Worker` constructor.
    "dedicated",
    # `SharedWorker` constructor.
    "shared",
    # ES module workers — `new Worker(url, { type: 'module' })`.
    "module",
]

# browser:storage — the four tiers of the modern StorageManager API.
# `navigator.storage` is universally available; `estimate`, `persist`,
# and OPFS `getDirectory` came in later spec versions and browsers
# ship them independently.
[[subfeature-set]]
package = "browser:storage"
names = [
    # `navigator.storage` presence.
    "basic",
    # `navigator.storage.estimate()`.
    "estimate",
    # `navigator.storage.persist()`.
    "persist",
    # Origin Private File System — `navigator.storage.getDirectory()`.
    "directory",
]

# browser:webauthn — spec tiers that ship independently across browsers.
[[subfeature-set]]
package = "browser:webauthn"
names = [
    # `PublicKeyCredential` + `navigator.credentials.get`/`create`.
    "basic",
    # Conditional mediation — `PublicKeyCredential.isConditionalMediationAvailable`.
    "conditional-mediation",
    # Platform authenticator (Touch ID, Windows Hello, etc.).
    "platform-auth",
    # `PublicKeyCredential.getClientCapabilities()` — very recent
    # addition, ships incrementally across browsers.
    "client-capabilities",
]

# browser:webgpu — progressive layers documented at the top of
# `wit/deps/browser-webgpu/webgpu.wit` in the WasmOS repo.
[[subfeature-set]]
package = "browser:webgpu@0.9.0"
names = [
    # v0.1 — the "triangle path": adapter, device, WGSL shader module,
    # render pipeline with implicit layout, canvas context, per-frame
    # texture + view, command encoder, render pass, submit.
    "triangle",
    # v0.2 — the "buffers layer": buffer resource + map-async, buffer
    # descriptor, buffer-usage flags, map-mode, device.create-buffer,
    # queue.write-buffer, copy-buffer-to-buffer / -texture.
    "buffers",
    # v0.3 — bind groups + explicit pipeline layouts (breaking against
    # v0.2 because render-pipeline-descriptor grows a required layout
    # field).
    "bind-groups",
    # v0.4 — vertex and index buffers wired into pipelines.
    "vertex-index",
    # v0.5 — textures beyond the swapchain + samplers.
    "textures-samplers",
    # v0.6 — depth/stencil, blend state, cull/front-face pipeline
    # state.
    "depth-stencil-blend",
    # v0.7 — compute pipelines + render bundles.
    "compute-bundles",
    # v0.8 — the "polish batch": features/limits at device creation,
    # adapter.info(), queue.on-submitted-work-done, present-mode on
    # canvas configuration, compressed texture formats.
    "polish",
    # v0.9 — the "introspection batch": adapter.get-info() returning
    # the full backend-type/adapter-type/vendor-id/device-id record,
    # adapter.get-features() enumerating supported feature-name arms,
    # adapter.get-limits() / device.get-limits() returning the full
    # 32-field limits record.
    "introspection",
]
