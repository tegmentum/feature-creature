<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wasm-feature-detect browser harness</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <h1>wasm-feature-detect</h1>
    <p>
      Live run of the JS bootstrap in the browser. The decoded feature map is
      exposed at <code>window.__result</code> (or <code>window.__error</code>
      if instantiation failed) and printed as JSON below.
    </p>
    <pre id="result">running...</pre>

    <script type="module">
      // Path is relative to this HTML file. The static server maps this to
      //   /target/wasm32-unknown-unknown/release/wasm_feature_detector.wasm
      // when serving from the repo root.
      const wasmURL = new URL(
        "../../target/wasm32-unknown-unknown/release/wasm_feature_detector.wasm",
        import.meta.url,
      );
      const pre = document.getElementById("result");

      try {
        const { detect, WASM_UNSUPPORTED } = await import("../src/index.js");
        const result = await detect(fetch(wasmURL));
        if (result === WASM_UNSUPPORTED) {
          const payload = { error: "WASM_UNSUPPORTED" };
          window.__error = payload;
          pre.textContent = JSON.stringify(payload, null, 2);
        } else {
          // Object.create(null) prototypes serialise fine but do not round-trip
          // through Object spread as a plain object, so normalise for the DOM.
          const payload = {
            core: { ...result.core },
            environment: { ...result.environment },
          };
          window.__result = payload;
          pre.textContent = JSON.stringify(payload, null, 2);
        }
      } catch (err) {
        const payload = { error: String(err && err.stack ? err.stack : err) };
        window.__error = payload;
        pre.textContent = JSON.stringify(payload, null, 2);
      } finally {
        // Sentinel the test can await regardless of which branch ran.
        document.documentElement.dataset.ready = "1";
      }
    </script>
  </body>
</html>
